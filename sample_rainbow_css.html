
<html>

<head>

<title>Basic CSS practice</title>

<link href="https://fonts.googleapis.com/css?family=Itim" rel="stylesheet"><!-- Google Font-->

<style>
 
body {
	background-color: #B2DFDB;
	font-size: 20px;
	font-family: 'Itim', cursive;
	color: white;
	text-align: center;
	background-image: url('https://images.pexels.com/photos/1542495/pexels-photo-1542495.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260');
    background-position: center; /* left or right also work */
    background-repeat: no-repeat; /* no-repeat or repeat-y or repeat-x */
	background-size: 75%;
}

h1 {
font-size: 60px;
    margin:25%;
color: lightgreen;
text-shadow: 1px 1px #cccccc; /* shadow thickness, offset, and color */
text-align: center;
}

p {
color: black;
}

/* Links */

/* a normal link before it is clicked on */
a:link 
{
text-decoration: none;
}

/* a link after it has been clicked on */
a:visited 
{
text-decoration: none;
color: #002366;
}

/* what the link looks like when a mouse is on it */
a:hover 
{
text-decoration: underline;
color: #4DB6AC;
}

/* what the link looks like the moment it is clicked */
a:active 
{
text-decoration: underline;
color: #80CBC4;
}

</style>

</head>

<body>

<h1>Remember that sometimes not getting what you want is a wonderful stroke of luck.</h1>
<p><em>- Dalai Lama</em></p>
<p><a href="http://www.ineedmotivation.com/blog/2008/04/20-wise-quotes-from-the-dalai-lama/" target="_blank">Source</a></p>

</html>
